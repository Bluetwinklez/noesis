name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, unit/integration, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
      - name: Rust dependency audit
        run: |
          cargo install cargo-audit --locked
          cd src-tauri && cargo audit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  windows:
    name: Windows build + Rust tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      # tauri::generate_context! embeds ../dist, so the frontend must exist first.
      - run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build unsigned installers (NSIS + MSI)
        run: npx tauri build
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Tee-Object SHA256SUMS.txt
      # Acceptance scenarios 1 and 15: install the NSIS build silently, launch it, confirm the
      # Rust core created and migrated its database, then uninstall cleanly.
      - name: Install, launch and uninstall smoke test
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Noesis\noesis.exe'
          if (!(Test-Path $exe)) { throw "noesis.exe not installed at $exe" }
          $p = Start-Process $exe -PassThru
          $db = Join-Path $env:APPDATA 'app.noesis.desktop\noesis.db'
          # First start on a cold runner (WebView2 init) can be slow: wait up to 60 s for the database.
          for ($i = 0; $i -lt 60 -and !(Test-Path $db) -and !$p.HasExited; $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Noesis exited early with code $($p.ExitCode)" }
          if (!(Test-Path $db)) { throw "database not created at $db" }
          Write-Host "Running (pid $($p.Id)); database: $((Get-Item $db).Length) bytes"
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          $un = Join-Path $env:LOCALAPPDATA 'Noesis\uninstall.exe'
          Start-Process $un -ArgumentList '/S' -Wait
          # The NSIS uninstaller re-launches itself from %TEMP%, so -Wait can return early.
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
          Write-Host 'Install / launch / uninstall OK'
      - uses: actions/upload-artifact@v5
        with:
          name: noesis-windows-x64-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
