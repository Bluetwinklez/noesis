name: Release

# Builds the Windows installers for a version tag, smoke-tests the installer, and
# publishes them with SHA-256 checksums as a GitHub pre-release. Installers are
# UNSIGNED unless code-signing is configured separately (see docs/releases/README.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release and browser workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-browser-report
          path: playwright-report/
  windows-release:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - run: npx tauri build
      - name: Install, launch and uninstall smoke test
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi | Copy-Item -Destination out
          Get-ChildItem out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out/SHA256SUMS.txt
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (!(Test-Path $notes)) { throw "missing release notes $notes" }
          gh release create "$env:RELEASE_TAG" (Get-ChildItem out/*).FullName --verify-tag --prerelease --title "Noesis $env:RELEASE_TAG — Knowledge Workspace Preview" --notes-file $notes
