name: Release

# Two kinds of release:
# - Every push to main becomes a continuous build `v<major>.<minor>.<run number>`.
#   Its signed installer and latest.json let installed apps update themselves.
#   This requires the TAURI_SIGNING_PRIVATE_KEY secret (see docs/releases/README.md);
#   without it the build is still tested but nothing is published.
# - A pushed `vX.Y.Z` tag publishes that exact version as a pre-release (versions in
#   the repository must already match the tag).
# Installers are not Authenticode-signed; updates are verified with the updater key.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release and browser workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: release-browser-report
          path: playwright-report/

  windows-release:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Decide version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $kind = 'tag'
          } else {
            $base = (Get-Content package.json | ConvertFrom-Json).version.Split('.')
            $tag = "v$($base[0]).$($base[1]).$($env:GITHUB_RUN_NUMBER)"
            node scripts/set-version.mjs $tag.TrimStart('v')
            $kind = 'continuous'
            $subject = git log -1 --format=%s
            $body = git log -1 --format=%b
            Set-Content "docs/releases/$tag.md" "# Noesis $tag`n`nContinuous build from ``main`` ($($env:GITHUB_SHA.Substring(0,7))).`n`n## Change`n`n**$subject**`n`n$body`n`nInstalled copies of Noesis download this update automatically. See the README for first-time installation."
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_KIND=$kind" >> $env:GITHUB_ENV
          Write-Host "Building $tag ($kind)"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:HAS_UPDATER_KEY -eq 'true') {
            npx tauri build --config '{\"bundle\":{\"createUpdaterArtifacts\":true}}'
          } else {
            Write-Host '::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without update signatures; installed apps cannot auto-update to this build.'
            npx tauri build
          }
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }
      - name: Install, launch and uninstall smoke test
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - name: Collect artifacts, checksums and update manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi,*.sig | Copy-Item -Destination out
          Get-ChildItem out -Exclude *.sig | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out/SHA256SUMS.txt
          if ($env:HAS_UPDATER_KEY -eq 'true') {
            node scripts/make-latest-json.mjs $env:RELEASE_TAG out (git log -1 --format=%s)
          }
      - name: Publish
        if: env.RELEASE_KIND == 'tag' || env.HAS_UPDATER_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (!(Test-Path $notes)) { throw "missing release notes $notes" }
          $files = (Get-ChildItem out/*).FullName
          if ($env:RELEASE_KIND -eq 'tag') {
            gh release create "$env:RELEASE_TAG" $files --verify-tag --prerelease --title "Noesis $env:RELEASE_TAG — Knowledge Workspace Preview" --notes-file $notes
          } else {
            # Continuous builds are full releases so /releases/latest (and the updater) can find them.
            gh release create "$env:RELEASE_TAG" $files --target $env:GITHUB_SHA --latest --title "Noesis $env:RELEASE_TAG" --notes-file $notes
          }
