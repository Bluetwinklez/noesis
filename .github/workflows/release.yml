name: Release

# Builds the Windows installers for a version tag, smoke-tests the installer, and
# publishes them with SHA-256 checksums as a GitHub pre-release. Installers are
# UNSIGNED unless code-signing is configured separately (see docs/releases/README.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - run: npx tauri build
      - name: Install, launch and uninstall smoke test
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Noesis\noesis.exe'
          if (!(Test-Path $exe)) { throw "noesis.exe not installed at $exe" }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Noesis exited early with code $($p.ExitCode)" }
          if (!(Test-Path (Join-Path $env:APPDATA 'app.noesis.desktop\noesis.db'))) { throw 'database not created' }
          Stop-Process -Id $p.Id -Force
          Start-Process (Join-Path $env:LOCALAPPDATA 'Noesis\uninstall.exe') -ArgumentList '/S' -Wait
      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi | Copy-Item -Destination out
          Get-ChildItem out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out/SHA256SUMS.txt
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = "docs/releases/${{ github.ref_name }}.md"
          if (!(Test-Path $notes)) { throw "missing release notes $notes" }
          gh release create "${{ github.ref_name }}" (Get-ChildItem out/*).FullName --prerelease --title "Noesis ${{ github.ref_name }}" --notes-file $notes
