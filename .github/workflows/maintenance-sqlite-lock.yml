# Temporary maintenance workflow: generate a Cargo.lock with Cargo itself, never hand-edit.
name: Refresh patched SQLite lockfile
on:
  push:
    branches:
      - security/sqlite-rustsec-2026-11-19
    paths:
      - '.github/workflows/maintenance-sqlite-lock.yml'
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Generate lockfile with Cargo
        working-directory: src-tauri
        run: |
          cargo update -p rusqlite --precise 0.41.0
          cargo tree --locked -i libsqlite3-sys
          grep -A 2 '^name = "libsqlite3-sys"$' Cargo.lock
          grep -A 2 '^name = "rusqlite"$' Cargo.lock
      - name: Commit generated lockfile to maintenance branch
        shell: bash
        run: |
          test -n "$(git status --porcelain src-tauri/Cargo.lock)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/Cargo.lock
          git commit -m 'chore(deps): regenerate Cargo.lock for patched SQLite'
          git push origin "HEAD:refs/heads/security/sqlite-rustsec-2026-11-19"
